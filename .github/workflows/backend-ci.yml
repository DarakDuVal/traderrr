name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traderrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run tests with pytest
        working-directory: backend
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=html --cov-report=xml

      - name: Check coverage threshold
        working-directory: backend
        run: |
          coverage report --fail-under=70

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: backend/htmlcov/

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      # Required checks
      - name: Check code formatting with Black (REQUIRED)
        working-directory: backend
        run: |
          black --check app/ scripts/ config/ tests/

      - name: Type checking with Mypy (REQUIRED)
        working-directory: backend
        run: |
          mypy app/ --ignore-missing-imports

      - name: Check for unused imports with Flake8 (REQUIRED)
        working-directory: backend
        run: |
          flake8 app/ --select=F401 --show-source --statistics

      # Informational checks
      - name: Code quality analysis with Pylint (REPORT ONLY)
        if: always()
        working-directory: backend
        run: |
          pylint app/ scripts/ config/ --exit-zero

  codeql:
    runs-on: ubuntu-latest
    name: CodeQL Security Scan
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config: |
            paths:
              - backend/

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
