name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "packages/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "packages/**"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint
        run: pnpm --filter mobile lint

      - name: Type check
        run: pnpm --filter mobile type-check

      - name: Expo export dry-run
        run: pnpm --filter mobile expo export --dump-sourcemap --output-dir /tmp/expo-export || echo "Expo export dry-run skipped (placeholder)"
