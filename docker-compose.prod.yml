# docker-compose.prod.yml — production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  beat:
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  db:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
